<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>범이와뚜 💗</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light;--bg:#fff9fb;--card:white;--text:#302b31;--sub:#777;--accent:#e67e9c;--line:#f3dce5}body.dark{color-scheme:dark;--bg:#211e25;--card:#302b34;--text:#f9eef3;--sub:#bfb3be;--line:#51414b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:520px;margin:auto;padding:20px 15px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:14px 0 4px}p{color:var(--sub);font-size:13px;margin:0 0 20px}button,input{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;background:var(--line);color:var(--text);cursor:pointer}.card{background:var(--card);padding:15px;border-radius:20px;box-shadow:0 4px 20px #00000008}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.nav strong{font-size:18px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week span{text-align:center;font-size:12px;color:var(--sub);padding:8px 0}.day{min-height:64px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:1px solid transparent;border-radius:9px;font-size:13px}.day.today{border-color:var(--accent)}.day.selected{background:var(--line)}.dot{background:var(--accent);width:6px;height:6px;border-radius:50%}.preview{width:100%;height:30px;object-fit:cover;border-radius:5px}.panel{margin-top:18px}h2{font-size:17px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);margin-bottom:10px}.primary{background:var(--accent);color:white;width:100%}.event{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.hint{font-size:12px;color:var(--sub);line-height:1.5;margin-top:15px}
</style>
</head>
<body><main><header><div><h1>💕 범이와뚜</h1><p>우리 둘만의 작은 기록 공간</p></div><button id="theme" aria-label="테마 변경">🌙</button></header><section class="card"><div class="nav"><button id="prev">❮</button><strong id="month"></strong><button id="next">❯</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar"></div></section><section class="card panel"><h2 id="selectedTitle"></h2><form id="form"><input id="eventInput" placeholder="우리의 일정이나 추억을 적어줘 💗" required maxlength="100"><button class="primary">일정 저장하기</button></form><div id="events"></div><div class="hint">지금은 이 브라우저에만 저장돼요. 다른 휴대폰과 공유하려면 추후 비공개 데이터베이스를 연결해야 해요. 중요한 추억은 아직 이곳에만 보관하지 마세요.</div></section></main>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date();let current=new Date(today.getFullYear(),today.getMonth(),1),selected=key(today);
let records={};try{records=JSON.parse(localStorage.getItem('beomddu-events')||'{}')}catch(e){};
const save=()=>localStorage.setItem('beomddu-events',JSON.stringify(records));
function render(){ $('month').textContent=`${current.getFullYear()}년 ${current.getMonth()+1}월`;const cal=$('calendar');cal.replaceChildren();const offset=new Date(current.getFullYear(),current.getMonth(),1).getDay(),length=new Date(current.getFullYear(),current.getMonth()+1,0).getDate();for(let i=0;i<offset;i++)cal.append(document.createElement('span'));for(let n=1;n<=length;n++){const d=key(new Date(current.getFullYear(),current.getMonth(),n)),b=document.createElement('button');b.className='day'+(d===selected?' selected':'')+(d===key(today)?' today':'');b.textContent=n;if(records[d]?.length){const dot=document.createElement('span');dot.className='dot';b.append(dot)}b.onclick=()=>{selected=d;render()};cal.append(b)}$('selectedTitle').textContent=`${selected}의 기록`;const list=$('events');list.replaceChildren();for(const [i,item] of (records[selected]||[]).entries()){const row=document.createElement('div');row.className='event';const label=document.createElement('span');label.textContent=item;const del=document.createElement('button');del.textContent='삭제';del.onclick=()=>{if(confirm('이 일정을 삭제할까?')){records[selected].splice(i,1);save();render()}};row.append(label,del);list.append(row)}}
$('prev').onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()-1,1);render()};$('next').onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()+1,1);render()};$('form').onsubmit=e=>{e.preventDefault();const value=$('eventInput').value.trim();if(!value)return;(records[selected]??=[]).push(value);save();$('eventInput').value='';render()};
const setTheme=dark=>{document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'☀️':'🌙';localStorage.setItem('beomddu-theme',dark?'dark':'light')};setTheme(localStorage.getItem('beomddu-theme')==='dark');$('theme').onclick=()=>setTheme(!document.body.classList.contains('dark'));render();
</script></body></html>
